<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5EDE0" />
    {%- if page.noindex %}
    <meta name="robots" content="noindex" />
    {%- endif %}
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32" />
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" />
    <link rel="preload" href="{{ '/assets/fonts/fraunces-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    <script src="{{ '/assets/js/menu.js' | relative_url }}" defer></script>
  </head>
  <body class="pagina-{{ page.layout }}">
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    {% include encabezado.html %}
    <main id="contenido">
      {{ content }}
    </main>
    {% include pie.html %}
  </body>
</html>
