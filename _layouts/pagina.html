---
layout: base
---
<article class="contenedor-lectura pagina">
  <header class="seccion-cabecera">
    <p class="etiqueta">{{ site.tagline }}</p>
    <h1>{{ page.title }}</h1>
    {%- if page.intro %}<p class="seccion-intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="prosa">
    {{ content }}
  </div>
</article>
